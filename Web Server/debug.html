	<div id="navbar">

				</tr>
			</table>

		<section class="monitor-card" style="height:auto; margin-bottom: 2rem; padding: 1rem;">
			<h2 style="display:inline-block; margin-right: 1rem;">status.json</h2>
			<div style="float:right; font-size: 0.8em; margin-top: 1.5rem;">

        		Loading…
        	</textarea>
		</section>

	<script>

		$(document).ready(function () {
			if (typeof CONFIG !== "undefined" && CONFIG.sysName) { $("#navtitle").text(CONFIG.sysName); }
			$("#status_json").load("data/status.json");
			// $("#query_log").load("data/query.log");
			$("#error_log").load("data/error.log");
			get_current_status();
			$('#server_local_time').text(json_status['time'].server_local_time);
			$('#relay_local_time').text(json_status['time'].relay_local_time);
			$('#mate_local_time').text(json_status['time'].mate_local_time);

			finalize_CSS();
		});
