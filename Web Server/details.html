<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="apple-mobile-web-app-capable" content="yes">

	<!-- Modern Favicon/Theme Colors -->
	<link rel="icon" href="./images/favicon16.png" type="image/png">
	<meta name="theme-color" content="#0a0b10">

	<!-- CSS -->
	<link rel="stylesheet" href="monitormate-modern.css?v=20260613b" type="text/css">

	<!-- Scripts -->
	<script src="./js/vendor/jquery-3.1.1.min.js?v=20260613b"></script>
	<script src="./config/config.php"></script>
	<script src="./js/monitormate.js?v=20260613b"></script>
	<script src="./js/monitormate-theme.js?v=20260613b"></script>

	<title>MonitorMate // METRICS</title>
</head>

<body>
	<div id="navbar">
		<div style="display:flex; flex-direction:column;">
			<h1>MonitorMate <span class="version">Details
					</span></h1>
			<div id="button-cluster">
				Last update: <span id="update_time" style="font-family: var(--font-mono);">SYNCING...</span>
			</div>
		</div>

		<ol id="toc">
			<li><a href="current.php">Status</a></li>
			<li><a href="historical.html">History</a></li>
			<li class="current"><a href="details.html">Details</a></li>
			<li><a href="debug.html">Debug</a></li>
		</ol>
	</div>
	<main class="dashboard-grid" style="display:block;">
		<!-- block display to allow full width sections instead of grid columns if needed, or keep grid -->

		<div id="hubinfo"></div>

		<section class="monitor-card" style="height:auto; margin-bottom: 2rem; padding: 1rem;">
			<h2>Inverters</h2>
			<div id="inverters">None Found</div>
		</section>

		<section class="monitor-card" style="height:auto; margin-bottom: 2rem; padding: 1rem;">
			<h2>Charge Controllers</h2>
			<div id="charge_controllers">None Found</div>
		</section>

		<section class="monitor-card" style="height:auto; margin-bottom: 2rem; padding: 1rem;">
			<h2>Battery Monitor</h2>
			<div id="fndc">None Found</div>
		</section>

	</main>

	<script>

		$(document).ready(function () {

			// set the system name in the navbar
			$('#navtitle').text(CONFIG.sysName);

			get_current_status();

			var devices_array = json_status['devices'];
			for (var i in devices_array) {
				switch (devices_array[i].device_id) {
					// FIXME: this is missing the Radian code!
					case ID.fx:
						if ($('#inverters').text() == "None Found") {
							$('#inverters').text('');
						}
						$('#inverters').append("<div class='status' style='display: inline-block;'><div id='device_" + i + "' class='status_content'>Inverter Found.</div></div>");
						$('#device_' + i).data('devAddress', ID.fx + ':' + devices_array[i].address);
						set_status('device_' + i, $('#device_' + i).data('devAddress'));
						break;
					// section added by DPO to cover FXR invertor cases
					case ID.fxr:
						if ($('#inverters').text() == "None Found") {
							$('#inverters').text('');
						}
						$('#inverters').append("<div class='status' style='display: inline-block;'><div id='device_" + i + "' class='status_content'>Inverter Found.</div></div>");
						$('#device_' + i).data('devAddress', ID.fxr + ':' + devices_array[i].address);
						set_status('device_' + i, $('#device_' + i).data('devAddress'));
						break;
					// end of section DPO
					case ID.cc:
						if ($('#charge_controllers').text() == "None Found") {
							$('#charge_controllers').text('');
						}
						$('#charge_controllers').append("<div class='status' style='display: inline-block;'><div id='device_" + i + "' class='status_content'>Charge Controller Found.</div></div>");
						$('#device_' + i).data('devAddress', ID.cc + ':' + devices_array[i].address);
						set_status('device_' + i, $('#device_' + i).data('devAddress'));
						break;
					case ID.fndc:
						if ($('#fndc').text() == "None Found") {
							$('#fndc').text('');
						}
						$('#fndc').append("<div class='status' style='display: inline-block;'><div id='device_" + i + "' class='status_content'>FNDC Found.</div></div>");
						$('#device_' + i).data('devAddress', ID.fndc + ':' + devices_array[i].address);
						set_status('device_' + i, $('#device_' + i).data('devAddress'));
						break;
					case ID.rad:
						if ($('#inverters').text() == "None Found") {
							$('#inverters').text('');
						}
						$('#inverters').append("<div class='status' style='display: inline-block;'><div id='device_" + i + "' class='status_content'>Inverter Found.</div></div>");
						$('#device_' + i).data('devAddress', ID.rad + ':' + devices_array[i].address);
						set_status('device_' + i, $('#device_' + i).data('devAddress'));
						break;
				}
			}

			setInterval("refresh_data()", 2 * 1000);

			finalize_CSS();

		});

		function refresh_data() {
			get_current_status();
			for (i = 0; i <= 9; i++) {

				if ($('#device_' + i).length > 0) {
					set_status('device_' + i, $('#device_' + i).data('devAddress'));
				}

			}
		}

	</script>

</body>

</html>
